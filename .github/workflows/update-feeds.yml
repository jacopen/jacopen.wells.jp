name: Update feeds

# RSSフィードの新着を src/data/blog-data.json に追記してコミットする。
# main への push をきっかけにホスティング側のデプロイが走る想定。
on:
  schedule:
    - cron: "17 21 * * *" # 毎日 06:17 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run update-feeds
      - name: Commit changes
        run: |
          if git diff --quiet -- src/data/blog-data.json; then
            echo "No new feed entries."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/blog-data.json
          git commit -m "Update feed cache"
          git push
